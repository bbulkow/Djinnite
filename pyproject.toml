[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djinnite"
version = "0.8.0"
description = "Lightweight AI abstraction layer for multiple providers (Gemini, Claude, OpenAI)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Brian Bulkowski"},
]
keywords = ["ai", "llm", "gemini", "claude", "openai", "abstraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Floors only, never ceilings. An SDK major that breaks Djinnite is fixed in
# Djinnite (AGENTS.md "Dependencies have floors, never ceilings"); it is never
# capped with "<N", because a library's ceiling becomes every consumer's
# ceiling. tests/test_package_metadata.py enforces this and keeps
# requirements.txt identical. uv.lock records the versions that were validated.
dependencies = [
    "google-genai>=2.0",
    "anthropic[vertex]>=1.0",
    "openai>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real provider APIs (needs keys and network; opt in with --live)",
    "live_platform: calls Google Vertex AI in the project ai_config.json names (opt in with --live-platform)",
    "live_platform_extended: costlier platform tier (opt in with --live-platform --live-platform-extended)",
]
# A test function that `return`s its result instead of asserting silently
# PASSES under pytest -- every check inside it is ignored. Make that an error.
filterwarnings = [
    "error::pytest.PytestReturnNotNoneWarning",
]

[tool.setuptools.package-dir]
# Map package names to directories relative to pyproject.toml.
# Since pyproject.toml IS inside the djinnite package, "." = this directory.
"djinnite" = "."
"djinnite.ai_providers" = "ai_providers"
"djinnite.prompts" = "prompts"
"djinnite.scripts" = "scripts"
"djinnite.tests" = "tests"
"djinnite.config" = "config"

[tool.setuptools]
packages = [
    "djinnite",
    "djinnite.ai_providers",
    "djinnite.prompts",
    "djinnite.scripts",
    "djinnite.tests",
    "djinnite.config",
]

[tool.setuptools.package-data]
"djinnite.config" = ["*.json"]
